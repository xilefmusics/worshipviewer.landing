<svg xmlns="http://www.w3.org/2000/svg" width="632" height="900" viewBox="-6 0 632 900" role="img" aria-labelledby="title desc">
  <title id="title">E over D sharp chord bass and double-context fingering diagram</title>
  <desc id="desc">Four-fret chord grid starting at fret 6, with finger 1 on the A string at fret 6 and fingers 3 and 4 held on the D and G strings at fret 9. The low E string is not played.</desc>

  <g fill="none" stroke="#0b0b0b" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 40 H580" stroke-width="12"/>
    <path d="M40 40 V860 M148 40 V860 M256 40 V860 M364 40 V860 M472 40 V860 M580 40 V860" stroke-width="12"/>
    <path d="M40 245 H580 M40 450 H580 M40 655 H580 M40 860 H580" stroke-width="12"/>
  </g>

  <!-- Do not strum the low E string -->
  <path d="M12 2 L68 18 M68 2 L12 18" fill="none" stroke="#d01d21" stroke-width="8" stroke-linecap="round"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">
    <text x="310" y="28" fill="#0b0b0b" font-size="28">Fret 6</text>

    <!-- Fretboard markers at frets 7 and 9 -->
    <circle cx="310" cy="348" r="39" fill="#abb0bc"/>
    <circle cx="310" cy="758" r="39" fill="#abb0bc"/>

    <circle cx="148" cy="143" r="39" fill="#d01d21"/><text x="148" y="155" fill="#fff">1</text>
    <circle cx="256" cy="758" r="39" fill="#d01d21"/><text x="256" y="770" fill="#fff">3</text>
    <circle cx="364" cy="758" r="39" fill="#d01d21"/><text x="364" y="770" fill="#fff">4</text>
  </g>
</svg>
