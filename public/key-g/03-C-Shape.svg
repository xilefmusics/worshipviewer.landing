<svg xmlns="http://www.w3.org/2000/svg" viewBox="95 58 1344 245" width="1344" height="245" role="img" aria-labelledby="title desc">
  <title id="title">Movable C shape chords for the key of G</title>
  <desc id="desc">Full guitar fretboard showing C with fingers on A fret 3, D fret 5, and B fret 5; D moved up two frets; E minor with the B-string note lowered one fret; and G moved higher. The low E string is muted.</desc>
  <defs>
    <style>
      .bg { fill: #fff; }
      .fret { fill: none; stroke: #1f1f1f; stroke-width: 4; }
      .nut { stroke: #000; stroke-width: 12; }
      .string { fill: none; stroke: #111; stroke-linecap: round; stroke-width: 4; }
      .marker { fill: #9ca3af; opacity: .9; }
      .label { fill: #111; font: 700 18px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .open-note { fill: #111; font: 700 20px Arial, Helvetica, sans-serif; text-anchor: end; dominant-baseline: middle; }
      .dot-i { fill: #f97316; }
      .dot-iv { fill: #e11d48; }
      .dot-v { fill: #facc15; }
      .dot-vim { fill: #a855f7; }
      .shape { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .shape-i { stroke: #c2410c; }
      .shape-iv { stroke: #9f1239; }
      .shape-v { stroke: #ca8a04; }
      .shape-vim { stroke: #6d28d9; }
      .degree { font: 700 22px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .degree-i { fill: #c2410c; }
      .degree-iv { fill: #9f1239; }
      .degree-v { fill: #ca8a04; }
      .degree-vim { fill: #6d28d9; }
      .finger { fill: #fff; font: 700 11px Arial, Helvetica, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .mute { font: 700 18px Arial, Helvetica, sans-serif; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect class="bg" x="95" y="58" width="1344" height="245" rx="16"/>

  <text class="degree degree-iv" x="445" y="80">4</text>
  <text class="degree degree-v" x="625" y="80">5</text>
  <text class="degree degree-vim" x="805" y="80">6m</text>
  <text class="degree degree-i" x="1075" y="80">1</text>

  <line class="nut" x1="130" y1="95" x2="130" y2="270"/>
  <path class="fret" d="M220 95V270 M310 95V270 M400 95V270 M490 95V270 M580 95V270 M670 95V270 M760 95V270 M850 95V270 M940 95V270 M1030 95V270 M1120 95V270 M1210 95V270 M1300 95V270 M1390 95V270"/>
  <path class="string" d="M130 95H1430 M130 130H1430 M130 165H1430 M130 200H1430 M130 235H1430 M130 270H1430"/>

  <circle class="marker" cx="355" cy="182" r="13"/>
  <circle class="marker" cx="535" cy="182" r="13"/>
  <circle class="marker" cx="715" cy="182" r="13"/>
  <circle class="marker" cx="895" cy="182" r="13"/>
  <circle class="marker" cx="1165" cy="150" r="13"/>
  <circle class="marker" cx="1165" cy="214" r="13"/>

  <!-- 4 (C): A3, D5, B5 -->
  <polyline class="shape shape-iv" points="355,235 535,200 535,130"/>
  <circle class="dot-iv" cx="355" cy="235" r="12"/><text class="finger" x="355" y="235">1</text>
  <circle class="dot-iv" cx="535" cy="200" r="12"/><text class="finger" x="535" y="200">3</text>
  <circle class="dot-iv" cx="535" cy="130" r="12"/><text class="finger" x="535" y="130">4</text>
  <text class="mute degree-iv" x="355" y="270">X</text>

  <!-- 5 (D): move the major shape up two frets -->
  <polyline class="shape shape-v" points="535,235 715,200 715,130"/>
  <circle class="dot-v" cx="535" cy="235" r="12"/><text class="finger" x="535" y="235">1</text>
  <circle class="dot-v" cx="715" cy="200" r="12"/><text class="finger" x="715" y="200">3</text>
  <circle class="dot-v" cx="715" cy="130" r="12"/><text class="finger" x="715" y="130">4</text>
  <text class="mute degree-v" x="535" y="270">X</text>

  <!-- 6m (Em): lower the B-string note by one fret and use finger 2 -->
  <polyline class="shape shape-vim" points="715,235 895,200 805,130"/>
  <circle class="dot-vim" cx="715" cy="235" r="12"/><text class="finger" x="715" y="235">1</text>
  <circle class="dot-vim" cx="895" cy="200" r="12"/><text class="finger" x="895" y="200">3</text>
  <circle class="dot-vim" cx="805" cy="130" r="12"/><text class="finger" x="805" y="130">2</text>
  <text class="mute degree-vim" x="715" y="270">X</text>

  <!-- 1 (G): move the major shape up again -->
  <polyline class="shape shape-i" points="985,235 1165,200 1165,130"/>
  <circle class="dot-i" cx="985" cy="235" r="12"/><text class="finger" x="985" y="235">1</text>
  <circle class="dot-i" cx="1165" cy="200" r="12"/><text class="finger" x="1165" y="200">3</text>
  <circle class="dot-i" cx="1165" cy="130" r="12"/><text class="finger" x="1165" y="130">4</text>
  <text class="mute degree-i" x="985" y="270">X</text>

  <text class="label" x="130" y="293">0</text>
  <text class="label" x="175" y="293">1</text><text class="label" x="265" y="293">2</text>
  <text class="label" x="355" y="293">3</text><text class="label" x="445" y="293">4</text>
  <text class="label" x="535" y="293">5</text><text class="label" x="625" y="293">6</text>
  <text class="label" x="715" y="293">7</text><text class="label" x="805" y="293">8</text>
  <text class="label" x="895" y="293">9</text><text class="label" x="985" y="293">10</text>
  <text class="label" x="1075" y="293">11</text><text class="label" x="1165" y="293">12</text>
  <text class="label" x="1255" y="293">13</text><text class="label" x="1345" y="293">14</text>

  <text class="open-note" x="113" y="95">e</text>
  <text class="open-note" x="113" y="130">B</text>
  <text class="open-note" x="113" y="165">G</text>
  <text class="open-note" x="113" y="200">D</text>
  <text class="open-note" x="113" y="235">A</text>
  <text class="open-note" x="113" y="270">E</text>
</svg>
