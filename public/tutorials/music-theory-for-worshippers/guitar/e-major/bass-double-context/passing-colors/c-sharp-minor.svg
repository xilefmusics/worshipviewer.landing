<svg xmlns="http://www.w3.org/2000/svg" width="632" height="900" viewBox="-6 0 632 900" role="img" aria-labelledby="title desc">
  <title id="title">C sharp minor passing chord with D sharp on the G string</title>
  <desc id="desc">Chord grid starting at fret 7, with finger 1 on low E at fret 9 muting the A string, finger 3 on D at fret 9, and finger 2 on G at fret 8.</desc>
