<svg xmlns="http://www.w3.org/2000/svg" width="632" height="900" viewBox="-6 0 632 900" role="img" aria-labelledby="title desc">
  <title id="title">B chord fingering diagram in frets 2 through 4</title>
  <desc id="desc">Chord grid starting at fret 2, with finger 1 on the A string at fret 2 and fingers 3 and 4 on the D and G strings at fret 4.</desc>

  <g fill="none" stroke="#0b0b0b" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 40 H580" stroke-width="12"/>
    <path d="M40 40 V860 M148 40 V860 M256 40 V860 M364 40 V860 M472 40 V860 M580 40 V860" stroke-width="12"/>
    <path d="M40 313 H580 M40 586 H580 M40 860 H580" stroke-width="12"/>
  </g>

  <!-- Do not strum the low E string -->
  <path d="M12 2 L68 18 M68 2 L12 18" fill="none" stroke="#d01d21" stroke-width="8" stroke-linecap="round"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">
    <text x="310" y="28" fill="#0b0b0b" font-size="28">Fret 2</text>
    <circle cx="310" cy="451" r="39" fill="#abb0bc"/>
    <circle cx="148" cy="176" r="39" fill="#d01d21"/><text x="148" y="188" fill="#fff">1</text>
    <circle cx="256" cy="724" r="39" fill="#d01d21"/><text x="256" y="736" fill="#fff">3</text>
    <circle cx="364" cy="724" r="39" fill="#d01d21"/><text x="364" y="736" fill="#fff">4</text>
  </g>
</svg>
