<svg xmlns="http://www.w3.org/2000/svg" viewBox="95 58 1344 245" width="1344" height="245" role="img" aria-labelledby="title desc">
  <title id="title">Movable one-finger chord shapes for the key of G</title>
  <desc id="desc">Full guitar fretboard showing the one-finger G shape moved to the six chord positions in G major. The low E, B, and high E strings are fretted together, the A string is muted, and the D and G strings remain open as context.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .fret { stroke: #1f1f1f; stroke-width: 4; }
      .nut { stroke: #000000; stroke-width: 12; }
      .string { stroke: #111111; stroke-linecap: round; stroke-width: 4; }
      .marker { fill: #9ca3af; opacity: 0.9; }
      .label { fill: #111111; font: 700 18px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .open-note { fill: #111111; font: 700 20px Arial, Helvetica, sans-serif; text-anchor: end; dominant-baseline: middle; }
      .chord-dot { fill: #f97316; }
      .chord-dot-red { fill: #e11d48; }
      .chord-dot-yellow { fill: #facc15; }
      .minor-dot-1 { fill: #14b8a6; }
      .minor-dot-2 { fill: #3b82f6; }
      .minor-dot-3 { fill: #a855f7; }
      .shape-line { fill: none; stroke-width: 5; stroke-linecap: round; }
      .shape-line-orange { stroke: #c2410c; }
      .shape-line-red { stroke: #9f1239; }
      .shape-line-yellow { stroke: #ca8a04; }
      .shape-line-minor-1 { stroke: #0f766e; }
      .shape-line-minor-2 { stroke: #1d4ed8; }
      .shape-line-minor-3 { stroke: #6d28d9; }
      .degree-label { font: 700 22px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .degree-i { fill: #c2410c; }
      .degree-iim { fill: #0f766e; }
      .degree-iiim { fill: #1d4ed8; }
      .degree-iv { fill: #9f1239; }
      .degree-v { fill: #ca8a04; }
      .degree-vim { fill: #6d28d9; }
      .finger-label { fill: #ffffff; font: 700 11px Arial, Helvetica, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .mute-label { font: 700 18px Arial, Helvetica, sans-serif; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect class="bg" x="95" y="58" width="1344" height="245" rx="16"/>

  <text class="degree-label degree-i" x="355" y="80">1</text>
  <text class="degree-label degree-iim" x="535" y="80">2m</text>
  <text class="degree-label degree-iiim" x="715" y="80">3m</text>
  <text class="degree-label degree-iv" x="805" y="80">4</text>
  <text class="degree-label degree-v" x="985" y="80">5</text>
  <text class="degree-label degree-vim" x="1165" y="80">6m</text>

  <line class="nut" x1="130" y1="95" x2="130" y2="270"/>
  <line class="fret" x1="220" y1="95" x2="220" y2="270"/>
  <line class="fret" x1="310" y1="95" x2="310" y2="270"/>
  <line class="fret" x1="400" y1="95" x2="400" y2="270"/>
  <line class="fret" x1="490" y1="95" x2="490" y2="270"/>
  <line class="fret" x1="580" y1="95" x2="580" y2="270"/>
  <line class="fret" x1="670" y1="95" x2="670" y2="270"/>
  <line class="fret" x1="760" y1="95" x2="760" y2="270"/>
  <line class="fret" x1="850" y1="95" x2="850" y2="270"/>
  <line class="fret" x1="940" y1="95" x2="940" y2="270"/>
  <line class="fret" x1="1030" y1="95" x2="1030" y2="270"/>
  <line class="fret" x1="1120" y1="95" x2="1120" y2="270"/>
  <line class="fret" x1="1210" y1="95" x2="1210" y2="270"/>
  <line class="fret" x1="1300" y1="95" x2="1300" y2="270"/>
  <line class="fret" x1="1390" y1="95" x2="1390" y2="270"/>

  <line class="string" x1="130" y1="95" x2="1430" y2="95"/>
  <line class="string" x1="130" y1="130" x2="1430" y2="130"/>
  <line class="string" x1="130" y1="165" x2="1430" y2="165"/>
  <line class="string" x1="130" y1="200" x2="1430" y2="200"/>
  <line class="string" x1="130" y1="235" x2="1430" y2="235"/>
  <line class="string" x1="130" y1="270" x2="1430" y2="270"/>

  <circle class="marker" cx="355" cy="182" r="13"/>
  <circle class="marker" cx="535" cy="182" r="13"/>
  <circle class="marker" cx="715" cy="182" r="13"/>
  <circle class="marker" cx="895" cy="182" r="13"/>
  <circle class="marker" cx="1165" cy="150" r="13"/>
  <circle class="marker" cx="1165" cy="214" r="13"/>

  <!-- 1 -->
  <line class="shape-line shape-line-orange" x1="355" y1="95" x2="355" y2="270"/>
  <circle class="chord-dot" cx="355" cy="95" r="12"/><text class="finger-label" x="355" y="95">4</text>
  <circle class="chord-dot" cx="355" cy="130" r="12"/><text class="finger-label" x="355" y="130">3</text>
  <text class="mute-label degree-i" x="355" y="235">X</text>
  <circle class="chord-dot" cx="355" cy="270" r="12"/><text class="finger-label" x="355" y="270">2</text>

  <!-- 2m -->
  <line class="shape-line shape-line-minor-1" x1="535" y1="95" x2="535" y2="270"/>
  <circle class="minor-dot-1" cx="535" cy="95" r="12"/><text class="finger-label" x="535" y="95">4</text>
  <circle class="minor-dot-1" cx="535" cy="130" r="12"/><text class="finger-label" x="535" y="130">3</text>
  <text class="mute-label degree-iim" x="535" y="235">X</text>
  <circle class="minor-dot-1" cx="535" cy="270" r="12"/><text class="finger-label" x="535" y="270">2</text>

  <!-- 3m -->
  <line class="shape-line shape-line-minor-2" x1="715" y1="95" x2="715" y2="270"/>
  <circle class="minor-dot-2" cx="715" cy="95" r="12"/><text class="finger-label" x="715" y="95">4</text>
  <circle class="minor-dot-2" cx="715" cy="130" r="12"/><text class="finger-label" x="715" y="130">3</text>
  <text class="mute-label degree-iiim" x="715" y="235">X</text>
  <circle class="minor-dot-2" cx="715" cy="270" r="12"/><text class="finger-label" x="715" y="270">2</text>

  <!-- 4 -->
  <line class="shape-line shape-line-red" x1="805" y1="95" x2="805" y2="270"/>
  <circle class="chord-dot-red" cx="805" cy="95" r="12"/><text class="finger-label" x="805" y="95">4</text>
  <circle class="chord-dot-red" cx="805" cy="130" r="12"/><text class="finger-label" x="805" y="130">3</text>
  <text class="mute-label degree-iv" x="805" y="235">X</text>
  <circle class="chord-dot-red" cx="805" cy="270" r="12"/><text class="finger-label" x="805" y="270">2</text>

  <!-- 5 -->
  <line class="shape-line shape-line-yellow" x1="985" y1="95" x2="985" y2="270"/>
  <circle class="chord-dot-yellow" cx="985" cy="95" r="12"/><text class="finger-label" x="985" y="95">4</text>
  <circle class="chord-dot-yellow" cx="985" cy="130" r="12"/><text class="finger-label" x="985" y="130">3</text>
  <text class="mute-label degree-v" x="985" y="235">X</text>
  <circle class="chord-dot-yellow" cx="985" cy="270" r="12"/><text class="finger-label" x="985" y="270">2</text>

  <!-- 6m -->
  <line class="shape-line shape-line-minor-3" x1="1165" y1="95" x2="1165" y2="270"/>
  <circle class="minor-dot-3" cx="1165" cy="95" r="12"/><text class="finger-label" x="1165" y="95">4</text>
  <circle class="minor-dot-3" cx="1165" cy="130" r="12"/><text class="finger-label" x="1165" y="130">3</text>
  <text class="mute-label degree-vim" x="1165" y="235">X</text>
  <circle class="minor-dot-3" cx="1165" cy="270" r="12"/><text class="finger-label" x="1165" y="270">2</text>

  <text class="label" x="130" y="293">0</text>
  <text class="label" x="175" y="293">1</text><text class="label" x="265" y="293">2</text>
  <text class="label" x="355" y="293">3</text><text class="label" x="445" y="293">4</text>
  <text class="label" x="535" y="293">5</text><text class="label" x="625" y="293">6</text>
  <text class="label" x="715" y="293">7</text><text class="label" x="805" y="293">8</text>
  <text class="label" x="895" y="293">9</text><text class="label" x="985" y="293">10</text>
  <text class="label" x="1075" y="293">11</text><text class="label" x="1165" y="293">12</text>
  <text class="label" x="1255" y="293">13</text><text class="label" x="1345" y="293">14</text>

  <text class="open-note" x="113" y="95">e</text>
  <text class="open-note" x="113" y="130">B</text>
  <text class="open-note" x="113" y="165">G</text>
  <text class="open-note" x="113" y="200">D</text>
  <text class="open-note" x="113" y="235">A</text>
  <text class="open-note" x="113" y="270">E</text>
</svg>
